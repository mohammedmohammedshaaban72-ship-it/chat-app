<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Chat</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .header {
      padding: 18px;
      background: #2563eb;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    #messages {
      height: calc(100vh - 130px);
      overflow-y: auto;
      padding: 15px;
      box-sizing: border-box;
    }

    .message {
      background: #2563eb;
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 15px;
      width: fit-content;
      max-width: 80%;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      padding: 10px;
      box-sizing: border-box;
      background: #1f2937;
    }

    #input {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 20px;
      outline: none;
      font-size: 16px;
    }

    button {
      margin-left: 8px;
      border: none;
      border-radius: 20px;
      padding: 0 20px;
      background: #2563eb;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="header">
    💬 My Chat
  </div>

  <div id="messages"></div>

  <div class="input-area">
    <input id="input" placeholder="اكتب رسالتك..." autocomplete="off">
    <button onclick="sendMessage()">إرسال</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    const input = document.getElementById("input");
    const messages = document.getElementById("messages");

    function sendMessage() {
      const message = input.value.trim();

      if (message !== "") {
        socket.emit("chat message", message);
        input.value = "";
      }
    }

    socket.on("chat message", (message) => {
      const div = document.createElement("div");
      div.className = "message";
      div.textContent = message;

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
